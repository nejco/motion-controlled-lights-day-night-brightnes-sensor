blueprint:
  name: Occupancy Light Control with Day/Night Brightness and Lux Limit
  description: >
    Control one or more lights from an occupancy sensor.
    Supports separate day/night brightness and timeout values,
    and optionally prevents turning lights on when ambient light
    is already above a selected lux threshold.
    Can be limited to daytime or nighttime only, so two automations
    can control different lights by day and by night.
  domain: automation
  input:
    run_when:
      name: Run when
      description: >
        Limit this automation to daytime or nighttime only. Day and night
        follow the night settings below (sunset or the fixed night start
        time, until sunrise or the fixed night end time). For separate day
        and night lights, create two automations with the same night settings.
      default: always
      selector:
        select:
          options:
            - label: Always
              value: always
            - label: Day only
              value: day
            - label: Night only
              value: night

    occupancy_sensor:
      name: Occupancy sensor
      description: Binary sensor used to detect occupancy/motion.
      selector:
        entity:
          domain: binary_sensor

    target_lights:
      name: Lights
      description: Select one or more lights to control.
      selector:
        target:
          entity:
            domain: light

    day_brightness:
      name: Day brightness
      description: Brightness percentage used during daytime.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    night_brightness:
      name: Night brightness
      description: Brightness percentage used during nighttime.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    day_timeout:
      name: Day timeout
      description: Time to wait before turning lights off during daytime.
      default:
        minutes: 5
      selector:
        duration: {}

    night_timeout:
      name: Night timeout
      description: Time to wait before turning lights off during nighttime.
      default:
        minutes: 1
      selector:
        duration: {}

    use_night_start_time:
      name: Use fixed night start time
      description: Enable a custom time when night mode should begin.
      default: false
      selector:
        boolean: {}

    night_mode_start_time:
      name: Night mode start time
      description: >
        Time of day when night mode starts (night brightness + timeout).
        Night mode ends at sunrise, or at the fixed end time below.
      default: "22:00:00"
      selector:
        time: {}

    use_night_end_time:
      name: Use fixed night end time
      description: >
        End night mode at a fixed time instead of at sunrise.
        Only used together with a fixed night start time.
      default: false
      selector:
        boolean: {}

    night_mode_end_time:
      name: Night mode end time
      description: Time of day when night mode ends.
      default: "06:00:00"
      selector:
        time: {}

    lux_sensor:
      name: Lux sensor
      description: Optional ambient light sensor.
      default: ""
      selector:
        entity:
          domain: sensor

    lux_limit:
      name: Brightness limit (lux)
      description: >
        If a lux sensor is selected and current lux is above this value,
        lights will not turn on.
      default: 100
      selector:
        number:
          min: 0
          max: 100000
          step: 1
          unit_of_measurement: lx

mode: restart
max_exceeded: silent

variables:
  run_when: !input run_when
  occupancy_sensor: !input occupancy_sensor
  target_lights: !input target_lights
  day_brightness: !input day_brightness
  night_brightness: !input night_brightness
  day_timeout: !input day_timeout
  night_timeout: !input night_timeout
  use_night_start_time: !input use_night_start_time
  night_mode_start_time: !input night_mode_start_time
  use_night_end_time: !input use_night_end_time
  night_mode_end_time: !input night_mode_end_time
  lux_sensor: !input lux_sensor
  lux_limit: !input lux_limit

  is_day: >
    {% if use_night_start_time %}
      {% set night_started = now() >= today_at(night_mode_start_time) %}
      {% if use_night_end_time %}
        {% set night_not_over = now() < today_at(night_mode_end_time) %}
      {% else %}
        {% set next_rising = as_datetime(state_attr('sun.sun', 'next_rising')) %}
        {% set night_not_over =
          is_state('sun.sun', 'below_horizon') and
          ((next_rising is none) or (next_rising.date() == now().date()))
        %}
      {% endif %}
      {{ not (night_started or night_not_over) }}
    {% else %}
      {{ is_state('sun.sun', 'above_horizon') }}
    {% endif %}
  selected_brightness: "{{ day_brightness if is_day else night_brightness }}"
  selected_timeout: "{{ day_timeout if is_day else night_timeout }}"

  lux_check_enabled: "{{ lux_sensor != '' }}"
  current_lux: >
    {% if lux_check_enabled %}
      {{ states(lux_sensor) | float(999999) }}
    {% else %}
      0
    {% endif %}
  lux_ok: >
    {% if lux_check_enabled %}
      {{ current_lux <= lux_limit }}
    {% else %}
      true
    {% endif %}

trigger:
  - platform: state
    entity_id: !input occupancy_sensor
    to: "on"

# Checked before a run starts, so a blocked trigger never restarts (and
# cancels) a run that is still waiting to turn the lights off.
condition:
  - condition: template
    value_template: "{{ run_when == 'always' or (run_when == 'day') == is_day }}"
  - condition: template
    value_template: "{{ lux_ok }}"

action:
  - service: light.turn_on
    target: !input target_lights
    data:
      brightness_pct: "{{ selected_brightness }}"

  - wait_for_trigger:
      - platform: state
        entity_id: !input occupancy_sensor
        to: "off"

  - delay: "{{ selected_timeout }}"

  - condition: state
    entity_id: !input occupancy_sensor
    state: "off"

  - service: light.turn_off
    target: !input target_lights
